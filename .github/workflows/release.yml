name: Publish verified Simpul GitHub Release

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: simpul-publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rzqllh/SubagentBridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Enforce release branch and exact tested main commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          expected = "release/v" + version
          assert os.environ["GITHUB_REF_NAME"] == expected, "Branch/version mismatch"
          subprocess.run(["git", "fetch", "origin", "main"], check=True)
          main = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          assert main == os.environ["GITHUB_SHA"], "Release commit must exactly match origin/main"
          print(f"Verified release v{version} at {main}")
          PY
      - name: Verify exact main commit completed all four CI jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python subagentbridge/release/ci_gate.py
      - name: Install reproducible QA and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build ruff==0.14.0 mypy==1.18.2 bandit==1.9.4
      - name: Verify full package and tests
        run: |
          python -m pytest tests artifacts/bootstrap/v3_1/tests -rs
          python -m ruff check --select E4,E7,E9,F subagentbridge
          python -m mypy --ignore-missing-imports --check-untyped-defs subagentbridge
          python -m bandit -q -r -ll subagentbridge
          python -m build --wheel --sdist
      # Sigstore certificate + SLSA provenance bind the released binaries to
      # this source/workflow. Fail closed: publication never follows failure.
      - name: Attest built wheel and sdist provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4 pinned commit
        with:
          subject-path: 'dist/*'
      - name: Verify signed build attestations before publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in dist/*; do
            gh attestation verify "$artifact" -R "$GITHUB_REPOSITORY" --format json > /dev/null
          done
      - name: Publish GitHub release from verified main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Tag/release already exists: ${TAG}; refusing overwrite" >&2
            exit 1
          fi
          awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{if(f) exit} f {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\nCommit: %s\nE18: BLOCKED (RISK_ACCEPTED_SAME_IDENTITY). Human approval remains required.\n' "$GITHUB_SHA" >> release-notes.md
          sha256sum dist/* > SHA256SUMS.txt
          gh release create "${TAG}" dist/* SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Simpul ${TAG} — Native Multi-Worker Orchestration" \
            --notes-file release-notes.md
