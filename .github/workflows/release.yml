name: Simpul supervised beta release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-verification:
    name: Release gate / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check ruff==0.14.0 mypy==1.18.2 bandit==1.9.4
      - name: Lint
        run: python -m ruff check --select E4,E7,E9,F subagentbridge
      - name: Typecheck
        run: python -m mypy --ignore-missing-imports --check-untyped-defs subagentbridge
      - name: Security static check
        run: python -m bandit -q -r -ll subagentbridge
      - name: Full test suite
        run: python -m pytest tests artifacts/bootstrap/v3_1/tests -rs

  publish-prerelease:
    name: Publish verified supervised beta
    needs: release-verification
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Check out exact verified main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version=$(python -c 'import tomllib; f=open("pyproject.toml","rb"); print(tomllib.load(f)["project"]["version"]); f.close()')
          test "$version" = "1.1.0" || { echo "Not target supervised beta; refusing publication"; exit 1; }
          test -f docs/public/RELEASE_NOTES.md
          test -f THIRD_PARTY_NOTICES.md
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Publish tag and GitHub prerelease only once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not replacing any published assets."
            exit 0
          fi
          if existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null); then
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "Refusing release: pre-existing tag $TAG points to $existing_sha, not $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Simpul $TAG — Supervised Beta" --prerelease --notes-file docs/public/RELEASE_NOTES.md
          gh release view "$TAG" --json tagName,isPrerelease,targetCommitish,url
