# PR-00 baseline unit tests and static quality gates. Not a production security certification.
name: PR-00 baseline contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-unit-tests:
    name: Baseline tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pin checked 2026-10-19
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pin checked 2026-10-19
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install package in editable mode
        run: python -m pip install --disable-pip-version-check -e .
      - name: Install pinned CI-only analysis tools
        run: python -m pip install --disable-pip-version-check ruff==0.14.0 mypy==1.18.2 bandit==1.9.4
      - name: Lint Python source and tests (no auto-fix)
        run: ruff check --select E4,E7,E9,F subagentbridge
      - name: Static type check Python source (no auto-fix)
        run: mypy --ignore-missing-imports --check-untyped-defs subagentbridge
      - name: Static security analysis of Python source (no auto-fix)
        run: bandit -q -r -ll subagentbridge
      - name: Run baseline stdlib tests (NOT security certification)
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run bootstrap v3.1 verification tests
        run: python -B -m unittest discover -s artifacts/bootstrap/v3_1/tests -p 'test_*.py' -v
      - name: Run full pytest suite (core & parity acceptance)
        run: python -m pytest tests artifacts/bootstrap/v3_1/tests -rs -v
      - name: Smoke test actual MCP server import (legacy workers stay disabled)
        env:
          SUBAGENTBRIDGE_DB_PATH: ${{ runner.temp }}/subagentbridge-pr00-smoke.db
        run: python -B -c "from mcp.server.fastmcp import FastMCP; import subagentbridge.server; print('MCP v1 server import PASS')"
